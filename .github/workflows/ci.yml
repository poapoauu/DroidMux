name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features full -- -D warnings

      - name: Run tests
        run: cargo test --workspace --features full

      - name: Build workspace
        run: cargo build --workspace --features full

  ffmpeg:
    name: FFmpeg decoder
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install FFmpeg development libraries
        run: sudo apt-get update && sudo apt-get install -y clang libavcodec-dev libavformat-dev libavutil-dev libswscale-dev pkg-config

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check FFmpeg decoder
        run: cargo clippy -p droidmux-control --no-default-features --features decoder-ffmpeg --all-targets -- -D warnings

      - name: Test FFmpeg decoder
        run: cargo test -p droidmux-control --no-default-features --features decoder-ffmpeg
