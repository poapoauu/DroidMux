[package]
name = "droidmux-control"
description = "Native Android screen mirroring and input control for DroidMux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
documentation = "https://docs.rs/droidmux-control"

[features]
default = ["decoder-openh264"]
decoder-openh264 = ["dep:openh264"]
# Requires an FFmpeg development SDK at build time. Normal DroidMux builds do
# not link or distribute FFmpeg libraries unless this feature is selected.
decoder-ffmpeg = ["dep:ffmpeg-next"]

[dependencies]
adb-client.workspace = true
adb-shell.workspace = true
adb-sync.workspace = true
bytes.workspace = true
image.workspace = true
openh264 = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true

[lints]
workspace = true
