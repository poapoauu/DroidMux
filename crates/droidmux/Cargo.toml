[package]
name = "droidmux"
description = "Native asynchronous ADB protocol SDK for Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = true
readme = "README.md"
documentation = "https://docs.rs/droidmux"
keywords = ["android", "adb", "wireless", "debugging", "async"]
categories = ["development-tools", "network-programming"]

[features]
default = ["tcp", "pairing", "shell", "sync"]
tcp = ["dep:adb-transport-tcp"]
pairing = ["dep:adb-pairing", "tcp"]
shell = ["dep:adb-shell"]
sync = ["dep:adb-sync"]
package = ["dep:adb-package", "shell", "sync"]
logcat = ["dep:adb-logcat"]
screenshot = ["dep:adb-screenshot"]
control = ["dep:adb-control", "shell", "sync"]
forward = ["dep:adb-forward"]
full = ["pairing", "package", "logcat", "screenshot", "control", "forward"]

[dependencies]
adb-auth.workspace = true
adb-client.workspace = true
adb-protocol.workspace = true
adb-transport.workspace = true
adb-transport-tcp = { workspace = true, optional = true }
adb-pairing = { workspace = true, optional = true }
adb-shell = { workspace = true, optional = true }
adb-sync = { workspace = true, optional = true }
adb-package = { workspace = true, optional = true }
adb-logcat = { workspace = true, optional = true }
adb-screenshot = { workspace = true, optional = true }
adb-control = { workspace = true, optional = true }
adb-forward = { workspace = true, optional = true }

[lints]
workspace = true
